<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>加工製作材料計算機</title>
<style>
:root {
  --bg: #0b0f19;
  --sidebar-bg: #111726;
  --surface-1: #151d30;
  --surface-2: #1b263e;
  --surface-3: #233252;
  --border: #24324f;
  --border-light: #33446b;
  --border-focus: #38bdf8;

  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --text-dim: #64748b;

  --accent: #38bdf8;
  --accent-rgb: 56, 189, 248;
  --accent-glow: rgba(56, 189, 248, 0.18);

  --raw-accent: #10b981;
  --raw-bg: rgba(16, 185, 129, 0.1);
  --raw-border: rgba(16, 185, 129, 0.35);

  --inter-accent: #f59e0b;
  --inter-bg: rgba(245, 158, 11, 0.1);
  --inter-border: rgba(245, 158, 11, 0.35);

  --prof-accent: #a855f7;
  --armor-accent: #06b6d4;
  --potion-accent: #10b981;
  --grenade-accent: #f97316;
  --tool-accent: #eab308;
  --acc-accent: #ec4899;

  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", "Noto Sans TC", sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, "Roboto Mono", Consolas, monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font-family: var(--font-sans);
  color: var(--text-main);
  background-color: var(--bg);
  background-image: 
    radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.05) 0px, transparent 40%),
    radial-gradient(at 100% 0%, rgba(168, 85, 247, 0.04) 0px, transparent 40%);
  background-attachment: fixed;
  line-height: 1.5;
  overflow-x: hidden;
}

/* App Container Layout */
.app-container {
  display: grid;
  grid-template-columns: 360px 1fr;
  min-height: 100vh;
}

/* Left Sidebar (Recipe Navigator & Search) */
.sidebar {
  background: var(--sidebar-bg);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  height: 100vh;
  position: sticky;
  top: 0;
  overflow: hidden;
}

.sidebar-header {
  padding: 18px 16px 14px;
  border-bottom: 1px solid var(--border);
  background: var(--sidebar-bg);
  z-index: 10;
}
.sidebar-title {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
}
.sidebar-title h1 {
  font-size: 17px;
  font-weight: 800;
  margin: 0;
  letter-spacing: -0.01em;
  color: #fff;
}
.app-badge {
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 4px;
  background: rgba(56, 189, 248, 0.15);
  color: var(--accent);
  font-family: var(--font-mono);
  font-weight: 700;
  border: 1px solid rgba(56, 189, 248, 0.3);
}

/* Search Box in Sidebar */
.search-wrapper {
  position: relative;
  margin-bottom: 10px;
}
.search-input {
  width: 100%;
  height: 38px;
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: #fff;
  padding: 0 12px 0 32px;
  font-size: 13px;
  outline: none;
  transition: all 0.15s ease;
}
.search-input:focus {
  border-color: var(--border-focus);
  box-shadow: 0 0 0 2px var(--accent-glow);
}
.search-icon {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-dim);
  font-size: 13px;
}

/* Category Filter Tabs */
.filter-tabs {
  display: flex;
  gap: 4px;
  background: var(--surface-1);
  padding: 3px;
  border-radius: 8px;
  border: 1px solid var(--border);
}
.filter-tab {
  flex: 1;
  border: none;
  background: transparent;
  color: var(--text-muted);
  font-size: 12px;
  font-weight: 700;
  padding: 6px 0;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.12s ease;
  text-align: center;
}
.filter-tab.active {
  background: var(--surface-3);
  color: #fff;
  box-shadow: 0 2px 6px rgba(0,0,0,0.3);
}

/* Sidebar Recipe List */
.sidebar-list {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
}
.sidebar-list::-webkit-scrollbar { width: 5px; }
.sidebar-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.group-container {
  margin-bottom: 8px;
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  background: var(--surface-1);
}
.group-header-btn {
  width: 100%;
  padding: 9px 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--surface-1);
  border: none;
  color: #fff;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.12s ease;
  text-align: left;
}
.group-header-btn:hover {
  background: var(--surface-2);
}
.group-meta {
  display: flex;
  align-items: center;
  gap: 6px;
}
.group-count {
  font-size: 11px;
  color: var(--text-dim);
  font-family: var(--font-mono);
}
.group-arrow {
  color: var(--text-dim);
  font-size: 10px;
  transition: transform 0.15s ease;
}
.group-container.open .group-arrow {
  transform: rotate(90deg);
}

.group-body {
  display: none;
  padding: 6px 8px 8px;
  border-top: 1px solid var(--border);
  background: var(--bg);
}
.group-container.open .group-body {
  display: block;
}

/* Recipe Row Items */
.recipe-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 8px;
  border-radius: 6px;
  cursor: pointer;
  margin-bottom: 2px;
  transition: all 0.1s ease;
  border: 1px solid transparent;
}
.recipe-row:hover {
  background: var(--surface-2);
  border-color: var(--border);
}
.recipe-row.active {
  background: var(--surface-3);
  border-color: var(--accent);
}
.recipe-row-name {
  font-size: 13px;
  font-weight: 600;
  color: #f1f5f9;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.recipe-row-tag {
  font-size: 10px;
  font-family: var(--font-mono);
  color: var(--text-dim);
}

/* Sub-group headers inside groups (e.g. classes / armor types) */
.sub-group-title {
  font-size: 11px;
  font-weight: 700;
  color: var(--text-dim);
  padding: 6px 8px 3px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

/* Right Main Content (Workspace) */
.main-workspace {
  padding: 24px 28px 48px;
  overflow-y: auto;
  max-width: 1280px;
}

/* Command Control Card */
.control-card {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px 18px;
  margin-bottom: 20px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}
.control-top {
  display: grid;
  grid-template-columns: 1fr 140px 110px;
  gap: 10px;
}
.primary-input {
  height: 42px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: #fff;
  padding: 0 14px;
  font-size: 15px;
  font-weight: 600;
  outline: none;
  transition: all 0.15s ease;
}
.primary-input:focus {
  border-color: var(--border-focus);
  box-shadow: 0 0 0 2px var(--accent-glow);
}
.btn-calc {
  background: #2563eb;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  transition: background 0.12s ease;
}
.btn-calc:hover { background: #1d4ed8; }

/* Quick Qty Badges */
.quick-qty-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 5px;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
}
.quick-qty-title {
  font-size: 11px;
  color: var(--text-dim);
  font-weight: 600;
  margin-right: 4px;
}
.q-btn {
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text-muted);
  padding: 2px 7px;
  border-radius: 5px;
  font-size: 11px;
  font-family: var(--font-mono);
  cursor: pointer;
  transition: all 0.1s ease;
}
.q-btn:hover {
  border-color: var(--accent);
  color: #fff;
}
.q-btn.active {
  background: rgba(56,189,248,0.15);
  border-color: var(--accent);
  color: var(--accent);
  font-weight: 700;
}

/* Result Header & Status Banner */
.result-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}
.result-title-group h2 {
  font-size: 22px;
  font-weight: 800;
  margin: 0;
  color: #fff;
}
.result-meta-info {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 3px;
  font-family: var(--font-mono);
}
.result-meta-info span {
  color: var(--accent);
}

.view-mode-tabs {
  display: flex;
  background: var(--surface-1);
  padding: 2px;
  border-radius: 6px;
  border: 1px solid var(--border);
  gap: 2px;
}
.view-btn {
  border: none;
  background: transparent;
  color: var(--text-muted);
  padding: 4px 10px;
  border-radius: 4px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}
.view-btn.active {
  background: var(--surface-3);
  color: #fff;
}

/* Topology Diagram in Results */
.panel-section {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 16px;
}
.panel-section-title {
  font-size: 14px;
  font-weight: 700;
  color: #fff;
  margin: 0 0 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.flow-container {
  overflow-x: auto;
  padding-bottom: 8px;
}
.flow-columns {
  display: flex;
  align-items: stretch;
  gap: 8px;
  min-width: max-content;
}
.flow-col {
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-width: 180px;
}
.flow-arrow-col {
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-dim);
  font-size: 16px;
  padding: 0 4px;
}
.flow-badge {
  font-size: 10px;
  color: var(--text-dim);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  text-align: center;
  padding-bottom: 2px;
}

.flow-card {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
}
.flow-card.root-card {
  border-color: #3b82f6;
  box-shadow: 0 0 0 1px #3b82f6 inset;
}
.flow-card-name {
  font-size: 13px;
  font-weight: 700;
  color: #fff;
  margin-bottom: 3px;
}
.flow-card-stats {
  font-size: 11px;
  color: var(--text-muted);
  line-height: 1.4;
  margin-bottom: 6px;
  font-family: var(--font-mono);
}
.flow-card-stats strong { color: var(--accent); }
.flow-card-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 3px;
}
.mini-tag {
  font-size: 10px;
  padding: 1px 5px;
  border-radius: 4px;
  background: var(--surface-1);
  border: 1px solid var(--border);
  color: var(--text-muted);
  font-family: var(--font-mono);
}
.mini-tag.raw {
  background: var(--raw-bg);
  border-color: var(--raw-border);
  color: var(--raw-accent);
}

/* Output Cards Grid (Intermediate & Raw) */
.dual-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
.summary-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 8px;
}
.stat-card {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
  border-left: 3px solid #64748b;
}
.stat-card.intermediate { border-left-color: var(--inter-accent); }
.stat-card.raw { border-left-color: var(--raw-accent); }

.stat-card-name {
  font-size: 12px;
  color: var(--text-muted);
  margin-bottom: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.stat-card-val {
  font-size: 17px;
  font-weight: 700;
  font-family: var(--font-mono);
  color: #fff;
}
.stat-card-sub {
  font-size: 10px;
  color: var(--text-dim);
  font-family: var(--font-mono);
}
.stat-card-sub strong { color: var(--inter-accent); }

.time-banner {
  margin-top: 12px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.time-banner-label {
  font-size: 12px;
  color: var(--text-muted);
}
.time-banner-val {
  font-size: 16px;
  font-weight: 800;
  color: var(--accent);
  font-family: var(--font-mono);
}

.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-dim);
  font-size: 14px;
}

@media (max-width: 960px) {
  .app-container { grid-template-columns: 1fr; }
  .sidebar { height: auto; position: static; }
  .dual-grid { grid-template-columns: 1fr; }
  .control-top { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="app-container">

  <!-- 左側邊欄：配方分類與即時搜尋導航 -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">
        <h1>配方資料庫</h1>
        <span class="app-badge">WORKBENCH</span>
      </div>
      <div class="search-wrapper">
        <span class="search-icon">🔍</span>
        <input id="sidebarSearch" class="search-input" placeholder="搜尋配方名稱、材料..." />
      </div>
      <div class="filter-tabs">
        <button class="filter-tab active" data-tab="all">全部</button>
        <button class="filter-tab" data-tab="processing">加工總覽</button>
        <button class="filter-tab" data-tab="manufacturing">製作總覽</button>
      </div>
    </div>

    <!-- 即時過濾的折疊式列表 -->
    <div class="sidebar-list" id="sidebarList"></div>
  </aside>

  <!-- 右側主工作台：目標需求設定與詳細拓撲分析 -->
  <main class="main-workspace">
    <!-- 目標需求設定卡 -->
    <div class="control-card">
      <div class="control-top">
        <input id="mainItemInput" class="primary-input" placeholder="輸入或從左側點選配方名稱..." />
        <input id="mainQtyInput" class="primary-input" type="number" min="1" step="1" value="1" placeholder="數量" />
        <button id="mainCalcBtn" class="btn-calc">計算需求</button>
      </div>

      <!-- 快速數量按鈕群組 -->
      <div class="quick-qty-bar">
        <span class="quick-qty-title">快速數量:</span>
        <button class="q-btn" data-q="1">1</button>
        <button class="q-btn" data-q="2">2</button>
        <button class="q-btn" data-q="3">3</button>
        <button class="q-btn" data-q="4">4</button>
        <button class="q-btn" data-q="6">6</button>
        <button class="q-btn" data-q="8">8</button>
        <button class="q-btn" data-q="9">9</button>
        <button class="q-btn" data-q="10">10</button>
        <button class="q-btn" data-q="12">12</button>
        <button class="q-btn" data-q="14">14</button>
        <button class="q-btn" data-q="15">15</button>
        <button class="q-btn" data-q="16">16</button>
        <button class="q-btn" data-q="18">18</button>
        <button class="q-btn" data-q="20">20</button>
        <button class="q-btn" data-q="21">21</button>
        <button class="q-btn" data-q="24">24</button>
        <button class="q-btn" data-q="27">27</button>
        <button class="q-btn" data-q="30">30</button>
      </div>
    </div>

    <!-- 計算結果展示區 -->
    <div id="resultWorkspace">
      <div class="empty-state">請由左側選擇品項或在上方輸入目標需求以開始分析。</div>
    </div>
  </main>
</div>

<script>

// 全域配方查找表
const allRecipes = [
  ...processingGroups.flatMap(g => g.recipes.map(r => ({...r, group:g.group, category:"processing"}))),
  ...manufacturingGroups.flatMap(g => g.recipes.map(r => ({...r, group:g.group, category:"manufacturing"})))

const recipeMap = new Map(allRecipes.map(r => [r.name, r]));

// DOM Elements

const sidebarSearchEl = document.getElementById("sidebarSearch");

let currentFilter = "all";
let searchTerm = "";

function esc(s){
  return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))
}
function fmtTime(sec){
  sec=Math.round(sec);
  const d=Math.floor(sec/86400); sec%=86400;
  const h=Math.floor(sec/3600); sec%=3600;
  const m=Math.floor(sec/60); const s=sec%60;
  const arr=[[d,"天"],[h,"時"],[m,"分"],[s,"秒"]].filter(x=>x[0]);
  return arr.map(x=>x.join("")).join(" ") || "0秒";
}

// 建立左側邊欄導航清單
function renderSidebar() {
  sidebarListEl.innerHTML = "";

  const groupsToDisplay = [];
  if (currentFilter === "all" || currentFilter === "processing") {
    groupsToDisplay.push(...processingGroups.map(g => ({...g, category:"processing"})));
  }
  if (currentFilter === "all" || currentFilter === "manufacturing") {
    groupsToDisplay.push(...manufacturingGroups.map(g => ({...g, category:"manufacturing"})));
  }

  groupsToDisplay.forEach(group => {
    // 依搜尋條件過濾
    const filteredRecipes = group.recipes.filter(r => {
      if (!searchTerm) return true;
      const matchName = r.name.toLowerCase().includes(searchTerm.toLowerCase());
      const matchMat = r.materials.some(m => m.name.toLowerCase().includes(searchTerm.toLowerCase()));
      const matchClass = r.useClass && r.useClass.toLowerCase().includes(searchTerm.toLowerCase());
      return matchName || matchMat || matchClass;
    });

    if (!filteredRecipes.length) return;

    const groupContainer = document.createElement("div");
    groupContainer.className = `group-container ${searchTerm ? "open" : ""}`;

    groupContainer.innerHTML = `
      <button class="group-header-btn">
        <span>${esc(group.group)}</span>
        <div class="group-meta">
          <span class="group-count">${filteredRecipes.length}</span>
          <span class="group-arrow">▶</span>
        </div>
      </button>
      <div class="group-body"></div>
    `;

    const bodyEl = groupContainer.querySelector(".group-body");

    // 依子類別群組排版
    if (group.subBranchType === "weapon" || group.subBranchType === "armor" || group.subBranchType === "potion") {
      const subCategories = [...new Set(filteredRecipes.map(r => r.useClass))];
      subCategories.forEach(subCat => {
        const subRecipes = filteredRecipes.filter(r => r.useClass === subCat);
        if (!subRecipes.length) return;

        const subTitle = document.createElement("div");
        subTitle.className = "sub-group-title";
        subTitle.textContent = subCat;
        bodyEl.appendChild(subTitle);

        subRecipes.forEach(recipe => {
          bodyEl.appendChild(createSidebarRow(recipe));
        });
      });
    } else {
      filteredRecipes.forEach(recipe => {
        bodyEl.appendChild(createSidebarRow(recipe));
      });
    }

    groupContainer.querySelector(".group-header-btn").addEventListener("click", () => {
      groupContainer.classList.toggle("open");
    });

    sidebarListEl.appendChild(groupContainer);
  });
}

function createSidebarRow(recipe) {
  const row = document.createElement("div");
  row.className = `recipe-row ${mainItemInput.value.trim() === recipe.name ? "active" : ""}`;
  row.dataset.name = recipe.name;

  row.innerHTML = `
    <span class="recipe-row-name" title="${esc(recipe.name)}">${esc(recipe.name)}</span>
    <span class="recipe-row-tag">×${recipe.outputQty}</span>
  `;

  row.addEventListener("click", (e) => {
    e.stopPropagation();
    mainItemInput.value = recipe.name;
    document.querySelectorAll(".recipe-row").forEach(r => r.classList.toggle("active", r.dataset.name === recipe.name));
    calculate();
  });

  return row;
}

// 核心遞迴展開計算樹
function buildTree(name, requiredQty, totals, depth=0){
  const recipe = recipeMap.get(name);
  if(!recipe){
    totals.raw[name] = (totals.raw[name] || 0) + requiredQty;
    return {name, requiredQty, isRaw:true, children:[]};
  }

  const batches = Math.ceil(requiredQty / recipe.outputQty);
  const producedQty = batches * recipe.outputQty;
  const totalTime = recipe.timeSeconds * batches;

  if(depth > 0){
    totals.intermediate[name] = (totals.intermediate[name] || 0) + requiredQty;
    totals.produced[name] = (totals.produced[name] || 0) + producedQty;
  }
  totals.time += totalTime;

  const children = recipe.materials.map(m => {
    const childRequired = m.qty * batches;
    return buildTree(m.name, childRequired, totals, depth + 1);
  });

  const childCritical = children.length
    ? Math.max(...children.map(c => c.criticalTime || 0))
    : 0;
  const criticalTime = totalTime + childCritical;

  return {name, requiredQty, isRaw:false, batches, producedQty, totalTime, criticalTime, children};
}

function collectCraftLevels(node, depth=0, levels={}){
  if(node.isRaw) return levels;
  if(!levels[depth]) levels[depth] = [];
  levels[depth].push(node);
  node.children.forEach(child => {
    if(!child.isRaw) collectCraftLevels(child, depth + 1, levels);
  });
  return levels;
}

function resultFlowHtml(tree){
  const levels = collectCraftLevels(tree);
  const depths = Object.keys(levels).map(Number);
  const maxDepth = Math.max(...depths);

  const columns = [];
  for(let depth=maxDepth; depth>=0; depth--){
    const nodes = levels[depth] || [];
    const cards = nodes.map(node => {
      const recipe = recipeMap.get(node.name);
      const tags = node.children.map(child => {
        const rawClass = child.isRaw ? "raw" : "";
        return `<span class="mini-tag ${rawClass}">${esc(child.name)} ×${child.requiredQty}</span>`;
      }).join("");

      return `
        <div class="flow-card ${depth === 0 ? "root-card" : ""}">
          <div class="flow-card-name">${esc(node.name)}</div>
          <div class="flow-card-stats">
            實做 <strong>×${node.producedQty}</strong> (${node.batches} 批)<br>
            耗時 ${node.totalTime > 0 ? fmtTime(node.totalTime) : "5秒"}
          </div>
          <div class="flow-card-tags">${tags}</div>
        </div>
      `;
    }).join("");

    columns.push(`
      <div class="flow-col">
        <div class="flow-badge">${depth === 0 ? "最終成品" : `前置第 ${depth} 階`}</div>
        ${cards}
      </div>
    `);

    if(depth > 0){
      columns.push(`<div class="flow-arrow-col">➔</div>`);
    }
  }

  return `<div class="flow-container"><div class="flow-columns">${columns.join("")}</div></div>`;
}

function calculate(){
  const name = mainItemInput.value.trim();
  const qty = Number(mainQtyInput.value);

  if(!name){
    resultWorkspace.innerHTML = '<div class="empty-state">請先輸入或從左側選擇品項名稱。</div>';
    return;
  }
  if(!Number.isFinite(qty) || qty <= 0){
    resultWorkspace.innerHTML = '<div class="empty-state">製作數量必須大於 0。</div>';
    return;
  }
  if(!recipeMap.has(name)){
    resultWorkspace.innerHTML = `<div class="empty-state">查無「${esc(name)}」配方資料。</div>`;
    return;
  }

  const totals = {raw:{}, intermediate:{}, produced:{}, time:0};
  const tree = buildTree(name, qty, totals, 0);
  const rootRecipe = recipeMap.get(name);
  const rootBatches = Math.ceil(qty / rootRecipe.outputQty);
  const rootProduced = rootBatches * rootRecipe.outputQty;

  const rawEntries = Object.entries(totals.raw);
  const interEntries = Object.entries(totals.intermediate);

  let typeInfo = rootRecipe.useClass ? ` ｜ 類型：<span>${rootRecipe.useClass}</span>` : "";

  resultWorkspace.innerHTML = `
    <div class="result-header">
      <div class="result-title-group">
        <h2>${esc(name)} × ${qty}</h2>
        <div class="result-meta-info">
          所屬：<span>${rootRecipe.group}</span>${typeInfo} ｜ 實際產出：<span>×${rootProduced} (${rootBatches} 批)</span>
        </div>
      </div>
    </div>

    <!-- 階段製作流程拓撲圖 -->
    <div class="panel-section">
      <div class="panel-section-title">
        <span>階段製作流程圖</span>
      </div>
      ${resultFlowHtml(tree)}
    </div>

    <!-- 中間物與原料彙整面板 -->
    <div class="dual-grid">
      <div class="panel-section">
        <div class="panel-section-title">
          <span>前置中間加工品 (${interEntries.length})</span>
        </div>
        ${interEntries.length ? `
          <div class="summary-grid">
            ${interEntries.map(([n, req]) => `
              <div class="stat-card intermediate">
                <div class="stat-card-name" title="${esc(n)}">${esc(n)}</div>
                <div class="stat-card-val">×${totals.produced[n]}</div>
                <div class="stat-card-sub">上層需求 ×${req}</div>
              </div>
            `).join("")}
          </div>
        ` : '<div style="color:var(--text-dim);font-size:12px">無中間加工需求（直接投入基礎材料）</div>'}
      </div>

      <div class="panel-section">
        <div class="panel-section-title">
          <span>基礎原物料總計 (${rawEntries.length})</span>
        </div>
        <div class="summary-grid">
          ${rawEntries.map(([n, q]) => `
            <div class="stat-card raw">
              <div class="stat-card-name" title="${esc(n)}">${esc(n)}</div>
              <div class="stat-card-val">×${q}</div>
              <div class="stat-card-sub">基礎原料</div>
            </div>
          `).join("")}
        </div>
        <div class="time-banner">
          <div class="time-banner-label">平行處理最短耗時</div>
          <div class="time-banner-val">${fmtTime(tree.criticalTime || 0)}</div>
        </div>
      </div>
    </div>
  `;
}

// 監聽事件
